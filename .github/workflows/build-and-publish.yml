name: Build and publish
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:

  create-version-tag:
    name: Create version tag
    runs-on: ubuntu-latest

    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v

  build-and-publish:
    name: Build and publish
    needs: create-version-tag
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.gradle_version.outputs.version }}
      main_deployment_id: ${{ steps.main_deployment.outputs.deployment_id }}
      gradle_plugin_deployment_id: ${{ steps.gradle_plugin_deployment.outputs.deployment_id }}

    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/setup-gradle@v6

      - name: Prepare Gradle version
        id: gradle_version
        shell: bash
        env:
          NEW_TAG: ${{ needs.create-version-tag.outputs.new_tag }}
        run: |
          version="${NEW_TAG#v}"
          if [[ -z "$version" || "$version" == "$NEW_TAG" && "$NEW_TAG" == v ]]; then
            echo "Could not derive a Gradle version from tag '$NEW_TAG'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing version $version from tag $NEW_TAG"

      - name: Build main project
        run: ./gradlew build -Pversion=${{ steps.gradle_version.outputs.version }} --stacktrace

      - name: Build included Gradle plugin
        run: ./gradlew -p anvilcord-gradle-plugin build -Pversion=${{ steps.gradle_version.outputs.version }} --stacktrace

      - name: Stage and upload main project artifacts
        id: main_deployment
        shell: bash
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew publishAllPublicationsToCentralBundleRepository \
            -Pversion=${{ steps.gradle_version.outputs.version }} \
            --stacktrace --info

          mapfile -t repository_roots < <(find anvilcord-core anvilcord-discord anvilcord-starter \
            -type d -path '*/build/publishing/centralBundle' -print | sort)
          bundle_path="$RUNNER_TEMP/main-project-central-bundle.zip"
          python3 - "$bundle_path" "${repository_roots[@]}" <<'PY'
          import os
          import sys
          import zipfile

          bundle_path = sys.argv[1]
          repository_roots = sys.argv[2:]
          if not repository_roots:
              raise SystemExit("No Maven Central bundle repository roots were found")
          with zipfile.ZipFile(bundle_path, "w", zipfile.ZIP_DEFLATED) as bundle:
              for repository_root in repository_roots:
                  for directory, _, filenames in os.walk(repository_root):
                      for filename in filenames:
                          if "maven-metadata" in filename:
                              continue
                          path = os.path.join(directory, filename)
                          archive_name = os.path.relpath(path, repository_root).replace(os.sep, "/")
                          bundle.write(path, archive_name)
          PY

          token="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 | tr -d '\n')"
          deployment_name="anvilcord-${{ steps.gradle_version.outputs.version }}-main"
          encoded_name="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$deployment_name")"
          upload_response="$(curl --fail-with-body --show-error --silent \
            --request POST \
            --header "Authorization: Bearer $token" \
            --header "Accept: application/json" \
            --form "bundle=@$bundle_path;type=application/octet-stream" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=$encoded_name&publishingType=USER_MANAGED")"
          deployment_id="$(UPLOAD_RESPONSE="$upload_response" python3 <<'PY'
          import json
          import os
          import re

          text = os.environ["UPLOAD_RESPONSE"].strip()
          try:
              parsed = json.loads(text)
              if isinstance(parsed, str):
                  print(parsed)
              elif isinstance(parsed, dict):
                  print(parsed.get("deploymentId") or parsed.get("id") or "")
              else:
                  print("")
          except Exception:
              match = re.search(
                  r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|(?=[A-Za-z0-9_-]{9,}\b)(?=[A-Za-z0-9_-]*[0-9])[A-Za-z0-9_-]+",
                  text,
              )
              print(match.group(0) if match else text.strip('"'))
          PY
          )"
          if [[ -z "$deployment_id" ]]; then
            echo "Central Portal upload returned an empty main project deployment ID" >&2
            echo "Upload response: $upload_response" >&2
            exit 1
          fi
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "Captured main project Maven Central deployment ID: $deployment_id"

      - name: Stage and upload Gradle plugin artifact
        id: gradle_plugin_deployment
        shell: bash
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew -p anvilcord-gradle-plugin publishAllPublicationsToCentralBundleRepository \
            -Pversion=${{ steps.gradle_version.outputs.version }} \
            --stacktrace --info

          bundle_path="$RUNNER_TEMP/gradle-plugin-central-bundle.zip"
          python3 - "$bundle_path" anvilcord-gradle-plugin/build/publishing/centralBundle <<'PY'
          import os
          import sys
          import zipfile

          bundle_path = sys.argv[1]
          repository_roots = sys.argv[2:]
          if not repository_roots:
              raise SystemExit("No Maven Central bundle repository roots were found")
          with zipfile.ZipFile(bundle_path, "w", zipfile.ZIP_DEFLATED) as bundle:
              for repository_root in repository_roots:
                  for directory, _, filenames in os.walk(repository_root):
                      for filename in filenames:
                          if "maven-metadata" in filename:
                              continue
                          path = os.path.join(directory, filename)
                          archive_name = os.path.relpath(path, repository_root).replace(os.sep, "/")
                          bundle.write(path, archive_name)
          PY

          token="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 | tr -d '\n')"
          deployment_name="anvilcord-${{ steps.gradle_version.outputs.version }}-gradle-plugin"
          encoded_name="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$deployment_name")"
          upload_response="$(curl --fail-with-body --show-error --silent \
            --request POST \
            --header "Authorization: Bearer $token" \
            --header "Accept: application/json" \
            --form "bundle=@$bundle_path;type=application/octet-stream" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=$encoded_name&publishingType=USER_MANAGED")"
          deployment_id="$(UPLOAD_RESPONSE="$upload_response" python3 <<'PY'
          import json
          import os
          import re

          text = os.environ["UPLOAD_RESPONSE"].strip()
          try:
              parsed = json.loads(text)
              if isinstance(parsed, str):
                  print(parsed)
              elif isinstance(parsed, dict):
                  print(parsed.get("deploymentId") or parsed.get("id") or "")
              else:
                  print("")
          except Exception:
              match = re.search(
                  r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|(?=[A-Za-z0-9_-]{9,}\b)(?=[A-Za-z0-9_-]*[0-9])[A-Za-z0-9_-]+",
                  text,
              )
              print(match.group(0) if match else text.strip('"'))
          PY
          )"
          if [[ -z "$deployment_id" ]]; then
            echo "Central Portal upload returned an empty Gradle plugin deployment ID" >&2
            echo "Upload response: $upload_response" >&2
            exit 1
          fi
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "Captured Gradle plugin Maven Central deployment ID: $deployment_id"

  release-published-artifacts:
    name: Release published artifacts
    needs:
      - create-version-tag
      - build-and-publish
    runs-on: ubuntu-latest
    environment:
      name: maven-central-release
      url: https://central.sonatype.com/publishing/deployments

    steps:
      - name: Publish approved Maven Central deployments
        shell: bash
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAIN_DEPLOYMENT_ID: ${{ needs.build-and-publish.outputs.main_deployment_id }}
          GRADLE_PLUGIN_DEPLOYMENT_ID: ${{ needs.build-and-publish.outputs.gradle_plugin_deployment_id }}
        run: |
          set -euo pipefail

          token="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 | tr -d '\n')"

          deployment_state() {
            local deployment_id="$1"
            curl --fail-with-body --show-error --silent \
              --request POST \
              --header "Authorization: Bearer $token" \
              --header "Accept: application/json" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$deployment_id"
          }

          publish_deployment() {
            local label="$1"
            local deployment_id="$2"
            if [[ -z "$deployment_id" ]]; then
              echo "Missing Maven Central deployment ID for $label" >&2
              exit 1
            fi

            publish_requested=false
            for attempt in {1..180}; do
              response="$(deployment_state "$deployment_id")"
              state="$(python3 -c 'import json, sys; print(json.load(sys.stdin).get("deploymentState", "UNKNOWN"))' <<< "$response")"
              echo "$label deployment $deployment_id state: $state"
              case "$state" in
                PUBLISHED)
                  return 0
                  ;;
                VALIDATED)
                  if [[ "$publish_requested" == false ]]; then
                    echo "Publishing $label Maven Central deployment $deployment_id"
                    curl --fail-with-body --show-error --silent \
                      --request POST \
                      --header "Authorization: Bearer $token" \
                      --header "Accept: application/json" \
                      "https://central.sonatype.com/api/v1/publisher/deployment/$deployment_id"
                    publish_requested=true
                  fi
                  ;;
                FAILED)
                  echo "$response" >&2
                  return 1
                  ;;
              esac
              sleep 10
            done

            echo "$label deployment $deployment_id did not reach PUBLISHED before timeout" >&2
            return 1
          }

          publish_deployment "main project" "$MAIN_DEPLOYMENT_ID"
          publish_deployment "Gradle plugin" "$GRADLE_PLUGIN_DEPLOYMENT_ID"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.create-version-tag.outputs.new_tag }}
          RELEASE_VERSION: ${{ needs.build-and-publish.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists; skipping creation"
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            --title "AnvilCord $RELEASE_VERSION" \
            --generate-notes
