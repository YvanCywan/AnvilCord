name: Build and publish

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish artifacts if credentials are available
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.semver.outputs.version }}
      publishable: ${{ steps.semver.outputs.publishable }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute next SemVer from Conventional Commits
        id: semantic-version
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: v
          major_pattern: '(!:|BREAKING CHANGE:|BREAKING-CHANGE:)'
          minor_pattern: '^feat(\(.+\))?:'
          version_format: '${major}.${minor}.${patch}'
          search_commit_body: true

      - name: Format Gradle version
        id: semver
        shell: bash
        env:
          NEXT_VERSION: ${{ steps.semantic-version.outputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "publishable=true" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_TYPE}" == "branch" && "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "version=${NEXT_VERSION}-SNAPSHOT" >> "$GITHUB_OUTPUT"
            if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
              echo "publishable=true" >> "$GITHUB_OUTPUT"
            else
              echo "publishable=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "version=${NEXT_VERSION}-ci.${GITHUB_RUN_NUMBER}.${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
            echo "publishable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Show generated version
        run: |
          echo "Generated version: ${{ steps.semver.outputs.version }}"
          echo "Base tag: ${{ steps.semantic-version.outputs.version_tag }}"

      - name: Build main project
        env:
          ANVILCORD_VERSION: ${{ steps.semver.outputs.version }}
        run: ./gradlew build --stacktrace

      - name: Build included Gradle plugin
        env:
          ANVILCORD_VERSION: ${{ steps.semver.outputs.version }}
        run: ./gradlew -p anvilcord-gradle-plugin build --stacktrace

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: build
    if: >-
      needs.build.outputs.publishable == 'true' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish)

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check publishing secrets are present
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          test -n "$MAVEN_CENTRAL_USERNAME" || { echo "MAVEN_CENTRAL_USERNAME is missing"; exit 1; }
          test -n "$MAVEN_CENTRAL_PASSWORD" || { echo "MAVEN_CENTRAL_PASSWORD is missing"; exit 1; }
          test -n "$SIGNING_KEY" || { echo "SIGNING_KEY is missing"; exit 1; }
          test -n "$SIGNING_PASSWORD" || { echo "SIGNING_PASSWORD is missing"; exit 1; }
          echo "Publishing secrets are configured."

      - name: Publish main project artifacts
        env:
          ANVILCORD_VERSION: ${{ needs.build.outputs.version }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publish --stacktrace --info

      - name: Publish Gradle plugin artifact
        env:
          ANVILCORD_VERSION: ${{ needs.build.outputs.version }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew -p anvilcord-gradle-plugin publish --stacktrace --info


